# The dataset, its terms and its releases (STANDARD.md §2.1, §8).
# Schema: PublicDataToolkit/schema/dataset.schema.json. Edited by hand; the releases list
# was written once from Census's directory listings.
standard_version: "0.1"
id: pulse
kind: survey
title: "Household Pulse Survey (HPS)"
publisher:
  name: "U.S. Census Bureau"
  url: "https://www.census.gov/"
url: "https://www.census.gov/programs-surveys/household-pulse-survey.html"
description: >-
  The Census Bureau's online survey of US adults on how the COVID-19 pandemic and later
  events affected households, every one or two weeks from April 2020 (weeks 1-63, 2020-2023)
  and in two-week cycles in 2024 (cycles 1-9). The questionnaire was revised by phase (1, 2,
  3, 3.1-3.10, 4.0-4.2). Each week or cycle is its own public use file, and its own release here.
# Terms are decided by a person, never by an agent or this template (STANDARD.md §8).
terms:
  url: "https://www.census.gov/about/policies/open-gov.html"
  summary: >-
    The Census Bureau's Open Government page: "The U.S. Census Bureau publishes
    its data as open data, meaning it is freely available for use and re-use by the public."
    The PUFs and their documentation are works of a US federal agency. The Census Data API's
    terms of service (https://www.census.gov/data/developers/about/terms-of-service.html) ask
    API products to say they are "not endorsed or certified by the Census Bureau"; this repo
    doesn't use the API.
  data: ship
  documentation: ship
  metadata: ship
  llm_processing: allowed
  reviewed_by: Allen Downey
  reviewed_on: '2026-11-20'
  notice: 'Source: U.S. Census Bureau, Household Pulse Survey public use files, 2020-2024. This product is not endorsed or certified by the Census Bureau.'
design:
  weights: [PWEIGHT]
  replicates:
    prefix: PWEIGHT
    n: 80
    method: sdr
    note: >-
      The 80 person replicate weights PWEIGHT1-80, in each cycle's replicate-weight file. The
      Source and Accuracy Statements: "Eighty replicate weights were created for the HPS", with
      Var = 4/80 Σ (θi - θ̂)² (hps-sa-week01, p. 12; hps-sa-cycle09), and Phase 4.2's statement
      names the method: "The Census Bureau uses successive difference replication". It cites
      Judkins (1990) on Fay's method but states no Fay factor, so `fay_factor` is left out.
      HWEIGHT (from week 13) has its own replicate weights, not in this slice.
dimensions:
  wave:
    label: "week (2020-2023) or cycle (2024)"
    note: >-
      Each week or cycle is one release, so a release holds one wave, named like the release
      (week01-week63, cycle01-cycle09).
releases:
  - id: "week01"
    label: "Household Pulse Survey, Phase 1, Week 1 public use file"
    status: superseded
    sources: [hps-week01, hps-user-notes-phase1]
    tables:
      - id: puf
        label: "Public use file (HPS_Week01_PUF_CSV.zip: the PUF CSV)"
        sources: [hps-week01]
        key: [SCRAM]
      - id: repwgt
        label: "Person replicate weights (HPS_Week01_PUF_CSV.zip: the replicate-weight CSV)"
        sources: [hps-week01]
        key: [SCRAM]
        references:
          - {columns: [SCRAM], table: puf}
