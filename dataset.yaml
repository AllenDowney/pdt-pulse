standard_version: "0.1"
id: pulse
title: "Household Pulse Survey (HPS)"
publisher:
  name: "U.S. Census Bureau"
  url: "https://www.census.gov/"
url: "https://www.census.gov/programs-surveys/household-pulse-survey.html"
description: "The Census Bureau\u0027s online survey of US adults on how the COVID-19 pandemic and later events affected households, run every one to two weeks from April 2020 to September 2024, with the questionnaire revised by phase."
