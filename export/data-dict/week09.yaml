name: pulse
label: Household Pulse Survey (HPS)
description: The Census Bureau's online survey of US adults on how the COVID-19 pandemic and later events
  affected households, every one or two weeks from April 2020 (weeks 1-63, 2020-2023) and in two-week
  cycles in 2024 (cycles 1-9). The questionnaire was revised by phase (1, 2, 3, 3.1-3.10, 4.0-4.2). Each
  week or cycle is its own public use file, and its own release here.
